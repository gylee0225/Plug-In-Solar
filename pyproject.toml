[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plug-in-solar"
version = "0.1.0"
description = "A pvlib calculation core and Rhino 8 Grasshopper component starter"
requires-python = ">=3.9"
dependencies = ["pvlib==0.13.0", "numpy==1.26.4", "pandas==2.2.3", "scipy==1.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
